<!doctype html>
<!-- 载具侧面图标的渲染页（tools/models/vehicons.mjs 用 Playwright 打开）：three.js 读原模型 GLB，正交镜头从右侧正对着拍，
     白色漫反射 + 上前方的主光 + 环境光（全息图标只要明暗和轮廓，不要贴图），透明背景，返回 PNG。
     零件拼的车（没有原模型的）用 renderParts 画：Roblox 零件（方块 / 圆柱 / 球 / 楔形）照尺寸和 CFrame 摆出来 -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const W = 1800, H = 700;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const white = new THREE.MeshLambertMaterial({ color: 0xffffff, side: THREE.DoubleSide });

function shoot(root, flip) {
  const scene = new THREE.Scene();
  scene.add(root);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.25);   // 主光：镜头这一侧、上方、偏车头
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35);  // 补光：从后上方，车尾、炮塔后面不至于一片黑
  scene.add(fill);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  // 镜头在 +X（flip 时在 −X）往回看：屏幕右边是 −Z（车头，Roblox 的朝向）；flip 的车头本来朝 +Z
  const side = flip ? -1 : 1;
  const halfW = Math.max(s.z / 2, (s.y / 2) * W / H) * 1.04;
  const halfH = halfW * H / W;
  const cam = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.01, s.x * 4 + 100);
  cam.position.set(c.x + side * (s.x * 2 + 20), c.y, c.z);
  cam.up.set(0, 1, 0);
  cam.lookAt(c);
  sun.position.set(c.x + side * 50, c.y + 70, c.z - side * 0 - 40 * side);
  sun.target.position.copy(c); scene.add(sun.target);
  fill.position.set(c.x + side * 20, c.y + 60, c.z + 60 * side);
  fill.target.position.copy(c); scene.add(fill.target);
  renderer.render(scene, cam);
  return { png: renderer.domElement.toDataURL('image/png'), size: [s.x, s.y, s.z] };
}

window.renderGLB = async (url, flip) => {
  const gltf = await new GLTFLoader().loadAsync(url);
  gltf.scene.traverse(o => { if (o.isMesh) { o.material = white; } });
  return shoot(gltf.scene, flip);
};

// parts：[{ shape: 'Block'|'Cylinder'|'Ball'|'Wedge'|'Mesh', size: [x,y,z], cf: [x,y,z, r00..r22] }]（Roblox 坐标）
window.renderParts = (parts, flip) => {
  const root = new THREE.Group();
  for (const p of parts) {
    let g;
    const [sx, sy, sz] = p.size;
    if (p.shape === 'Cylinder') { g = new THREE.CylinderGeometry(Math.min(sy, sz) / 2, Math.min(sy, sz) / 2, sx, 24); g.rotateZ(Math.PI / 2); }
    else if (p.shape === 'Ball') { g = new THREE.SphereGeometry(Math.min(sx, sy, sz) / 2, 20, 14); }
    else if (p.shape === 'Wedge') {
      // Roblox 楔形：底面满、顶在 −Z 那头高（斜面朝 +Y −Z… 实际是从 +Z 下沿斜到 −Z 上沿）
      const shape = new THREE.Shape();
      shape.moveTo(-sz / 2, -sy / 2); shape.lineTo(sz / 2, -sy / 2); shape.lineTo(sz / 2, sy / 2); shape.lineTo(-sz / 2, -sy / 2);
      g = new THREE.ExtrudeGeometry(shape, { depth: sx, bevelEnabled: false });
      g.translate(0, 0, -sx / 2); g.rotateY(-Math.PI / 2);
    }
    else { g = new THREE.BoxGeometry(sx, sy, sz); }
    const m = new THREE.Mesh(g, white);
    const e = p.cf;
    const mat = new THREE.Matrix4().set(e[3], e[4], e[5], e[0], e[6], e[7], e[8], e[1], e[9], e[10], e[11], e[2], 0, 0, 0, 1);
    m.applyMatrix4(mat);
    root.add(m);
  }
  return shoot(root, flip);
};
window.ready = true;
</script></body></html>
